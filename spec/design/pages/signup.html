<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アカウント登録 — fog</title>
    <style>
      :root {
        /* spec/design/tokens.md */
        --color-primary-lighter: oklch(0.93 0.04 292);
        --color-primary-light: oklch(0.78 0.09 292);
        --color-primary: oklch(0.63 0.13 292);
        --color-primary-dark: oklch(0.54 0.15 292);
        --color-primary-darker: oklch(0.45 0.15 292);
        --color-accent: oklch(0.62 0.19 40);
        --color-neutral-50: oklch(0.97 0.002 286);
        --color-neutral-100: oklch(0.945 0.004 286);
        --color-neutral-200: oklch(0.93 0.004 286);
        --color-neutral-300: oklch(0.875 0.006 278);
        --color-neutral-400: oklch(0.69 0.01 275);
        --color-neutral-500: oklch(0.58 0.01 275);
        --color-neutral-600: oklch(0.52 0.01 275);
        --color-neutral-700: oklch(0.38 0.008 275);
        --color-neutral-900: oklch(0.21 0.006 270);
        --color-success: oklch(0.55 0.13 155);
        --color-success-dark: oklch(0.42 0.11 155);
        --color-success-bg: oklch(0.95 0.03 155);
        --color-warning: oklch(0.6 0.13 75);
        --color-warning-dark: oklch(0.45 0.1 75);
        --color-warning-bg: oklch(0.96 0.04 90);
        --color-error: oklch(0.55 0.19 27);
        --color-error-bg: oklch(0.95 0.025 20);
        --color-error-dark: oklch(0.45 0.19 27);
        --color-info: var(--color-primary);
        --color-info-bg: var(--color-primary-lighter);
        --color-bg-page: oklch(0.93 0.004 286);
        --color-bg-page-top: oklch(0.955 0.003 286);
        --color-bg-card: oklch(1 0 0);
        --color-bg-hover: oklch(1 0 0 / 0.55);
        --color-overlay: oklch(0.21 0.006 270 / 0.28);
        --font-base: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Noto Sans JP", sans-serif;
        --text-xs: 0.72rem;
        --text-sm: 0.78rem;
        --text-base: 0.95rem;
        --text-lg: 1.05rem;
        --text-xl: clamp(1.2rem, 1.1rem + 0.5vw, 1.45rem);
        --text-2xl: clamp(1.45rem, 1.3rem + 0.8vw, 1.8rem);
        --weight-regular: 400;
        --weight-medium: 500;
        --weight-semibold: 600;
        --weight-bold: 700;
        --leading-tight: 1.5;
        --leading-normal: 1.85;
        --leading-loose: 2;
        --tracking-label: 0.03em;
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 0.875rem;
        --space-lg: 1.5rem;
        --space-xl: 1.875rem;
        --space-2xl: 2.5rem;
        --space-section: 2.25rem;
        --radius-sm: 0.375rem;
        --radius-md: 0.625rem;
        --radius-lg: 1.625rem;
        --radius-full: 9999px;
        --pad-btn: 12px 24px; /* フォームの主ボタン（認証系 .btn-primary） */
        --border-input: 1.3px solid var(--color-neutral-300); /* 入力枠線 */
        --color-text-inverse: oklch(1 0 0); /* 塗りボタン・トースト上の白文字 */
        --color-focus: var(--color-primary); /* 通常フォーカスリング */
        --icon-md: 19px; /* ヘッダー操作・行末操作（ジャンプ/復元/削除） */
        --shadow-sm: 0 2px 24px oklch(0.21 0.006 270 / 0.05);
        --transition-fast: 0.15s ease;
        --transition-default: 0.22s ease;
        --content-max: 50rem;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: linear-gradient(
          180deg,
          var(--color-bg-page-top) 0%,
          var(--color-bg-page) 240px
        );
        font-family: var(--font-base);
        color: var(--color-neutral-900);
        font-size: var(--text-base);
      }

      /* ===== 認証画面レイアウト ===== */
      .auth-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: var(--space-xl) var(--space-md);
      }

      .auth-sheet {
        background: var(--color-bg-card);
        border-radius: var(--radius-lg);
        max-width: 26rem;
        width: 100%;
        box-shadow: var(--shadow-sm);
        padding: var(--space-2xl) var(--space-lg);
      }

      @media (min-width: 640px) {
        .auth-sheet {
          padding: var(--space-2xl);
        }
      }

      /* ---- ブランド ---- */
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-lg);
        font-weight: var(--weight-semibold);
        justify-content: center;
        margin-bottom: var(--space-section);
      }


      /* ---- 見出し ---- */
      .page-title {
        font-size: var(--text-2xl);
        font-weight: var(--weight-bold);
        margin-bottom: var(--space-section);
        text-align: center;
        line-height: var(--leading-tight);
      }

      /* ---- フォーム ---- */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-bottom: var(--space-lg);
      }

      .form-label {
        font-size: var(--text-sm);
        font-weight: var(--weight-medium);
        color: var(--color-neutral-900);
      }

      .form-label-helper {
        display: block;
        font-size: var(--text-sm);
        font-weight: var(--weight-regular);
        color: var(--color-neutral-600);
        margin-top: var(--space-xs);
      }

      .form-input {
        padding: 12px 16px;
        border: var(--border-input);
        border-radius: var(--radius-md);
        font-family: inherit;
        font-size: var(--text-base);
        color: var(--color-neutral-900);
        background: var(--color-bg-card);
        transition: border-color var(--transition-fast);
      }

      .form-input::placeholder {
        color: var(--color-neutral-400);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--color-primary);
      }

      .form-input:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      .form-input.error {
        border-color: var(--color-error);
      }

      /* ---- エラーメッセージ ---- */
      .field-error {
        font-size: var(--text-sm);
        color: var(--color-error);
      }

      /* ---- ボタン ---- */
      .btn {
        padding: var(--pad-btn);
        border: none;
        border-radius: var(--radius-full);
        font-family: inherit;
        font-size: var(--text-base);
        font-weight: var(--weight-medium);
        cursor: pointer;
        transition: background var(--transition-fast),
          color var(--transition-fast),
          border-color var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--color-primary-dark);
        color: var(--color-text-inverse);
      }

      @media (hover: hover) {
        .btn-primary:hover:not(:disabled) {
          background: var(--color-primary-darker);
        }
      }

      .btn-primary:active:not(:disabled) {
        background: var(--color-primary-darker);
      }

      .btn-primary:disabled {
        background: var(--color-neutral-200);
        color: var(--color-neutral-400);
        cursor: default;
      }

      .btn-primary:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      .btn-outline {
        background: transparent;
        color: var(--color-neutral-900);
        border: var(--border-input);
      }

      @media (hover: hover) {
        .btn-outline:hover {
          border-color: var(--color-neutral-600);
          color: var(--color-neutral-900);
        }
      }

      .btn-outline:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      .btn-icon {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .btn-icon svg {
        width: var(--icon-md);
        height: var(--icon-md);
      }

      /* ---- SSO エリア ---- */
      .sso-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      .divider-text {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        margin: var(--space-lg) 0;
        color: var(--color-neutral-600);
        font-size: var(--text-sm);
      }

      .divider-text::before,
      .divider-text::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--color-neutral-100);
      }

      /* ---- リンク ---- */
      .form-links {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-top: var(--space-section);
        text-align: center;
        font-size: var(--text-sm);
        color: var(--color-neutral-600);
      }

      .form-link {
        color: var(--color-primary-dark);
        text-decoration: none;
        transition: color var(--transition-fast);
      }

      @media (hover: hover) {
        .form-link:hover {
          color: var(--color-primary-darker);
        }
      }

      .form-link:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* ---- 状態の例 ---- */
      .state-examples {
        max-width: var(--content-max);
        margin: var(--space-2xl) auto;
        padding: 0 var(--space-lg) var(--space-2xl);
      }

      .state-examples h2 {
        font-size: var(--text-sm);
        font-weight: var(--weight-semibold);
        color: var(--color-neutral-600);
        letter-spacing: var(--tracking-label);
        margin-bottom: var(--space-md);
      }

      .state-examples .example {
        background: var(--color-bg-card);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        padding: var(--space-lg);
        margin-bottom: var(--space-md);
      }

      .state-examples .example-label {
        font-size: var(--text-xs);
        color: var(--color-neutral-400);
        margin-bottom: var(--space-sm);
      }

      .state-examples .form-group {
        margin-bottom: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-sheet">
        <div class="brand">
          <svg viewBox="0 0 120 44" width="65.5" height="24" role="img" aria-label="fog">
            <g transform="scale(1.75)">
              <path d="M4.5 12 H19.5 M7 16 H15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="16.5" cy="7" r="1.8" fill="var(--color-accent)"/>
            </g>
            <g transform="translate(60 33.68) scale(0.04 -0.04)" fill="currentColor">
              <path d="M288 411L178 411L178 0L110 0L110 411L12 411L12 468L110 468L110 596Q110 676 149 722Q188 768 269 768Q282 768 297 766.5Q312 765 325 761L313 701Q302 704 291 706Q280 708 266 708Q239 708 221.5 699Q204 690 194.5 673.5Q185 657 181.5 635Q178 613 178 588L178 468L288 468Z"/>
              <path transform="translate(273 0)" d="M555 234Q555 181 536.5 136Q518 91 485 58Q452 25 406 6.5Q360 -12 305 -12Q251 -12 205 6.5Q159 25 126 58Q93 91 74.5 136Q56 181 56 234Q56 287 74.5 332Q93 377 126 410Q159 443 205 461.5Q251 480 305 480Q360 480 406 461.5Q452 443 485 410Q518 377 536.5 332Q555 287 555 234ZM483 234Q483 273 470.5 307.5Q458 342 435 367.5Q412 393 379 408Q346 423 305 423Q264 423 231.5 408Q199 393 176 367.5Q153 342 140.5 307.5Q128 273 128 234Q128 195 140.5 160.5Q153 126 176 100.5Q199 75 231.5 60.5Q264 46 305 46Q346 46 379 60.5Q412 75 435 100.5Q458 126 470.5 160.5Q483 195 483 234Z"/>
              <path transform="translate(862 0)" d="M115 -94Q143 -130 191.5 -155Q240 -180 294 -180Q344 -180 379 -165.5Q414 -151 435.5 -126Q457 -101 467 -67.5Q477 -34 477 4L477 92L475 92Q448 48 398.5 24Q349 0 298 0Q243 0 198.5 18Q154 36 122.5 67.5Q91 99 73.5 143Q56 187 56 238Q56 288 73.5 332Q91 376 122.5 409Q154 442 198.5 461Q243 480 298 480Q349 480 398 456Q447 432 475 387L477 387L477 468L545 468L545 4Q545 -34 534.5 -77Q524 -120 495.5 -156Q467 -192 418 -216Q369 -240 291 -240Q226 -240 167 -215Q108 -190 66 -146ZM128 240Q128 203 140 170Q152 137 174.5 112Q197 87 230 72.5Q263 58 305 58Q344 58 377 71Q410 84 434 108Q458 132 471.5 165.5Q485 199 485 240Q485 277 471.5 310Q458 343 434 368Q410 393 377 408Q344 423 305 423Q263 423 230 408Q197 393 174.5 368Q152 343 140 310Q128 277 128 240Z"/>
            </g>
          </svg>
        </div>

        <h1 class="page-title">アカウント登録</h1>

        <!-- 登録フォーム -->
        <form>
          <div class="form-group">
            <label class="form-label" for="signup-email">メールアドレス</label>
            <input
              type="email"
              id="signup-email"
              class="form-input"
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>

          <div class="form-group">
            <div>
              <label class="form-label" for="signup-password">パスワード</label>
              <span class="form-label-helper" id="signup-password-helper"
                >8文字以上。大文字・小文字・数字を含む</span
              >
            </div>
            <input
              type="password"
              id="signup-password"
              class="form-input"
              autocomplete="new-password"
              aria-describedby="signup-password-helper"
              placeholder="パスワード"
            />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%">
            登録する
          </button>
        </form>

        <!-- SSO -->
        <div class="divider-text">または</div>

        <div class="sso-group">
          <button type="button" class="btn btn-outline" style="width: 100%">
            <span class="btn-icon">
              <svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path
                  d="M20.5 12a8.5 8.5 0 1 1-2.5-6"
                  stroke-linecap="round"
                />
                <path d="M12 12h8.5" stroke-linecap="round" />
              </svg>
              Google で登録
            </span>
          </button>

          <button type="button" class="btn btn-outline" style="width: 100%">
            <span class="btn-icon">
              <svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path
                  d="M16.2 8c2.1.3 3.8 2.2 3.8 4.7 0 3.4-2.4 7.5-4.9 7.5-.9 0-1.5-.6-2.6-.6s-1.8.6-2.7.6C7.3 20.2 5 16.1 5 12.7 5 9.6 7.1 7.8 9.5 7.8c1 0 2 .6 2.6.6.6 0 1.8-.5 3-.4Z"
                  stroke-linejoin="round"
                />
                <path
                  d="M14.8 3.2c-.4 1.2-1.5 2.1-2.7 2.2 0-1.3 1.1-2.6 2.7-2.8 0 .2 0 .4 0 .6Z"
                  stroke-linejoin="round"
                />
              </svg>
              Apple で登録
            </span>
          </button>
        </div>

        <!-- リンク -->
        <div class="form-links">
          <a href="#" class="form-link">ログイン</a>
        </div>
      </div>
    </div>

    <!-- 状態の例（通常フロー外） -->
    <section class="state-examples" aria-label="状態の例">
      <h2>状態の例</h2>
      <div class="example">
        <p class="example-label">パスワード入力エラー（項目直下に表示）</p>
        <div class="form-group">
          <label class="form-label" for="example-password">パスワード</label>
          <input
            type="password"
            id="example-password"
            class="form-input error"
            autocomplete="new-password"
            aria-invalid="true"
            aria-describedby="example-password-error"
            placeholder="パスワード"
          />
          <div class="field-error" id="example-password-error">
            パスワードが要件を満たしていません
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
