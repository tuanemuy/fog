<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パスワードリセット — fog</title>
    <style>
      :root {
        /* spec/design/tokens.md */
        --color-primary-lighter: oklch(0.93 0.04 292);
        --color-primary-light: oklch(0.78 0.09 292);
        --color-primary: oklch(0.63 0.13 292);
        --color-primary-dark: oklch(0.54 0.15 292);
        --color-primary-darker: oklch(0.45 0.15 292);
        --color-accent: oklch(0.62 0.19 40);
        --color-neutral-50: oklch(0.97 0.002 286);
        --color-neutral-100: oklch(0.945 0.004 286);
        --color-neutral-200: oklch(0.93 0.004 286);
        --color-neutral-300: oklch(0.875 0.006 278);
        --color-neutral-400: oklch(0.69 0.01 275);
        --color-neutral-500: oklch(0.58 0.01 275);
        --color-neutral-600: oklch(0.52 0.01 275);
        --color-neutral-700: oklch(0.38 0.008 275);
        --color-neutral-900: oklch(0.21 0.006 270);
        --color-success: oklch(0.55 0.13 155);
        --color-success-dark: oklch(0.42 0.11 155);
        --color-success-bg: oklch(0.95 0.03 155);
        --color-warning: oklch(0.6 0.13 75);
        --color-warning-dark: oklch(0.45 0.1 75);
        --color-warning-bg: oklch(0.96 0.04 90);
        --color-error: oklch(0.55 0.19 27);
        --color-error-bg: oklch(0.95 0.025 20);
        --color-error-dark: oklch(0.45 0.19 27);
        --color-info: var(--color-primary);
        --color-info-bg: var(--color-primary-lighter);
        --color-bg-page: oklch(0.93 0.004 286);
        --color-bg-page-top: oklch(0.955 0.003 286);
        --color-bg-card: oklch(1 0 0);
        --color-bg-hover: oklch(1 0 0 / 0.55);
        --color-overlay: oklch(0.21 0.006 270 / 0.28);
        --font-base: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Noto Sans JP", sans-serif;
        --text-xs: 0.72rem;
        --text-sm: 0.78rem;
        --text-base: 0.95rem;
        --text-lg: 1.05rem;
        --text-xl: clamp(1.2rem, 1.1rem + 0.5vw, 1.45rem);
        --text-2xl: clamp(1.45rem, 1.3rem + 0.8vw, 1.8rem);
        --weight-regular: 400;
        --weight-medium: 500;
        --weight-semibold: 600;
        --weight-bold: 700;
        --leading-tight: 1.5;
        --leading-normal: 1.85;
        --leading-loose: 2;
        --tracking-label: 0.03em;
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 0.875rem;
        --space-lg: 1.5rem;
        --space-xl: 1.875rem;
        --space-2xl: 2.5rem;
        --space-section: 2.25rem;
        --radius-sm: 0.375rem;
        --radius-md: 0.625rem;
        --radius-lg: 1.625rem;
        --radius-full: 9999px;
        --pad-btn: 12px 24px; /* フォームの主ボタン（認証系 .btn-primary） */
        --border-input: 1.3px solid var(--color-neutral-300); /* 入力枠線 */
        --color-text-inverse: oklch(1 0 0); /* 塗りボタン・トースト上の白文字 */
        --color-focus: var(--color-primary); /* 通常フォーカスリング */
        --shadow-sm: 0 2px 24px oklch(0.21 0.006 270 / 0.05);
        --shadow-md: 0 12px 36px oklch(0.21 0.006 270 / 0.18);
        --transition-fast: 0.15s ease;
        --transition-default: 0.22s ease;
        --content-max: 50rem;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: linear-gradient(
          180deg,
          var(--color-bg-page-top) 0%,
          var(--color-bg-page) 240px
        );
        font-family: var(--font-base);
        color: var(--color-neutral-900);
        font-size: var(--text-base);
      }

      /* ===== 認証画面レイアウト ===== */
      /* login / signup と同型: 縦横中央で同じ位置にシートを置く */
      .auth-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: var(--space-xl) var(--space-md);
      }

      .auth-sheet {
        background: var(--color-bg-card);
        border-radius: var(--radius-lg);
        max-width: 26rem;
        width: 100%;
        box-shadow: var(--shadow-sm);
        padding: var(--space-2xl) var(--space-lg);
      }

      @media (min-width: 640px) {
        .auth-sheet {
          padding: var(--space-2xl);
        }
      }

      /* ---- ブランド ---- */
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-lg);
        font-weight: var(--weight-semibold);
        justify-content: center;
        margin-bottom: var(--space-section);
      }

      .brand .dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-full);
        background: var(--color-accent);
      }

      /* ---- 見出し ---- */
      .page-title {
        font-size: var(--text-2xl);
        font-weight: var(--weight-bold);
        margin-bottom: var(--space-lg);
        text-align: center;
        line-height: var(--leading-tight);
      }

      .page-description {
        font-size: var(--text-sm);
        color: var(--color-neutral-600);
        text-align: center;
        text-wrap: balance;
        margin-bottom: var(--space-section);
      }

      /* ---- フォーム ---- */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-bottom: var(--space-lg);
      }

      .form-label {
        font-size: var(--text-sm);
        font-weight: var(--weight-medium);
        color: var(--color-neutral-900);
      }

      .form-input {
        padding: 12px 16px;
        border: var(--border-input);
        border-radius: var(--radius-md);
        font-family: inherit;
        font-size: var(--text-base);
        color: var(--color-neutral-900);
        background: var(--color-bg-card);
        transition: border-color var(--transition-fast);
      }

      .form-input::placeholder {
        color: var(--color-neutral-400);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--color-primary);
      }

      .form-input:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      /* ---- ボタン ---- */
      .btn {
        padding: var(--pad-btn);
        border: none;
        border-radius: var(--radius-full);
        font-family: inherit;
        font-size: var(--text-base);
        font-weight: var(--weight-medium);
        cursor: pointer;
        transition: background var(--transition-fast),
          color var(--transition-fast),
          border-color var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--color-primary-dark);
        color: var(--color-text-inverse);
      }

      @media (hover: hover) {
        .btn-primary:hover:not(:disabled) {
          background: var(--color-primary-darker);
        }
      }

      .btn-primary:active:not(:disabled) {
        background: var(--color-primary-darker);
      }

      .btn-primary:disabled {
        background: var(--color-neutral-200);
        color: var(--color-neutral-400);
        cursor: default;
      }

      .btn-primary:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      /* ---- エラー表示 ---- */
      .error-message {
        background: var(--color-error-bg);
        border: 1px solid var(--color-error);
        border-radius: var(--radius-md);
        padding: 12px 16px;
        font-size: var(--text-sm);
        color: var(--color-error-dark);
      }

      /* ---- リンク ---- */
      .form-link {
        font-size: var(--text-sm);
        color: var(--color-primary-dark);
        text-decoration: none;
        transition: color var(--transition-fast);
      }

      @media (hover: hover) {
        .form-link:hover {
          color: var(--color-primary-darker);
        }
      }

      .form-link:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* ---- トースト ---- */
      .toast {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--color-neutral-900);
        color: var(--color-text-inverse);
        font-size: var(--text-sm);
        font-weight: var(--weight-medium);
        padding: 12px 20px;
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-md);
      }

      /* ---- 状態の例 ---- */
      .state-examples {
        max-width: var(--content-max);
        margin: var(--space-2xl) auto;
        padding: 0 var(--space-lg) var(--space-2xl);
      }

      .state-examples h2 {
        font-size: var(--text-sm);
        font-weight: var(--weight-semibold);
        color: var(--color-neutral-600);
        letter-spacing: var(--tracking-label);
        margin-bottom: var(--space-md);
      }

      .state-examples .example {
        background: var(--color-bg-card);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        padding: var(--space-lg);
        margin-bottom: var(--space-md);
      }

      .state-examples .example-label {
        font-size: var(--text-xs);
        color: var(--color-neutral-400);
        margin-bottom: var(--space-sm);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-sheet">
        <div class="brand">
          <span>fog</span><span class="dot"></span>
        </div>

        <h1 class="page-title">パスワードリセット</h1>
        <p class="page-description">
          アカウントが存在する場合、リセットリンクをお送りします
        </p>

        <!-- メインフォーム：メールアドレス入力 -->
        <form>
          <div class="form-group">
            <label class="form-label" for="reset-email">メールアドレス</label>
            <input
              type="email"
              id="reset-email"
              class="form-input"
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%">
            リセットメールを送る
          </button>
        </form>

      </div>
    </div>

    <!-- 状態の例（通常フロー外） -->
    <section class="state-examples" aria-label="状態の例">
      <h2>状態の例</h2>
      <div class="example">
        <p class="example-label">
          送信完了のトースト（実アプリでは画面下部中央に固定表示・数秒で自動消滅）
        </p>
        <div class="toast">リセットメールを送信しました</div>
      </div>
      <div class="example">
        <p class="example-label">新パスワード再設定（リンクから遷移した画面）</p>
        <div class="form-group">
          <label class="form-label" for="reset-new-password">新パスワード</label>
          <input
            type="password"
            id="reset-new-password"
            class="form-input"
            autocomplete="new-password"
            placeholder="新しいパスワード"
          />
        </div>
        <button type="button" class="btn btn-primary" style="width: 100%">
          パスワードを更新
        </button>
      </div>
      <div class="example">
        <p class="example-label">リンク期限切れ</p>
        <div class="error-message">
          リセットリンクの有効期限が切れました。もう一度
          <a href="#" class="form-link">パスワードリセット</a>
          をお試しください
        </div>
      </div>
    </section>
  </body>
</html>
