packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@tanstack/router-core": 1.169.2
  tinypool: 1.0.2
# `.d.ts` files inside the pnpm store resolve bare `react` / `vitest`
# type imports by walking up to the workspace root, so @types packages
# must stay visible there now that they are declared per-package.
publicHoistPattern:
  - "@types/*"
allowBuilds:
  esbuild: true
  sharp: false
  workerd: false
patchedDependencies:
  '@tanstack/router-core@1.169.2': patches/@tanstack__router-core@1.169.2.patch
