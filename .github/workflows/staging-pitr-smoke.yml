name: Staging PITR smoke

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Disposable staging namespace label
        required: true
        type: string
      user_data_target:
        description: Opaque disposable Account Home identifier
        required: true
        type: string
      user_data_bookmark:
        description: User Data bookmark to restore
        required: true
        type: string
      directory_target:
        description: Disposable Directory generation:bucket
        required: true
        type: string
      directory_bookmark:
        description: Identity Directory bookmark to restore
        required: true
        type: string

permissions:
  contents: read

jobs:
  user-data:
    name: Restore, verify, and undo User Data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-pitr
    concurrency:
      group: staging-pitr-user-data-${{ inputs.user_data_target }}
      cancel-in-progress: false
    env:
      PITR_OPERATOR_URL: ${{ secrets.PITR_OPERATOR_URL }}
      PITR_OPERATOR_TOKEN: ${{ secrets.PITR_OPERATOR_TOKEN }}
      PITR_USER_DATA_TARGET: ${{ inputs.user_data_target }}
      PITR_USER_DATA_BOOKMARK: ${{ inputs.user_data_bookmark }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: User Data restore and undo
        run: |
          mkdir -p .artifacts/pitr
          pnpm --filter @repo/web pitr:operator restore user-data \
            "$PITR_USER_DATA_TARGET" \
            "$PITR_USER_DATA_BOOKMARK" \
            > .artifacts/pitr/user-data-restore.json
          pnpm --filter @repo/web pitr:operator undo \
            "$(cat .artifacts/pitr/user-data-restore.json)" \
            > .artifacts/pitr/user-data-undo.json

      - name: Upload User Data receipts
        uses: actions/upload-artifact@v4
        with:
          name: staging-pitr-user-data-${{ github.run_id }}
          path: .artifacts/pitr/user-data-*.json
          retention-days: 1

  identity-directory:
    name: Restore, verify, and undo Identity Directory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-pitr
    concurrency:
      group: staging-pitr-directory-${{ inputs.directory_target }}
      cancel-in-progress: false
    env:
      PITR_OPERATOR_URL: ${{ secrets.PITR_OPERATOR_URL }}
      PITR_OPERATOR_TOKEN: ${{ secrets.PITR_OPERATOR_TOKEN }}
      PITR_DIRECTORY_TARGET: ${{ inputs.directory_target }}
      PITR_DIRECTORY_BOOKMARK: ${{ inputs.directory_bookmark }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Identity Directory restore and undo
        run: |
          mkdir -p .artifacts/pitr
          pnpm --filter @repo/web pitr:operator restore identity-directory \
            "$PITR_DIRECTORY_TARGET" \
            "$PITR_DIRECTORY_BOOKMARK" \
            > .artifacts/pitr/identity-directory-restore.json
          pnpm --filter @repo/web pitr:operator undo \
            "$(cat .artifacts/pitr/identity-directory-restore.json)" \
            > .artifacts/pitr/identity-directory-undo.json

      - name: Upload Identity Directory receipts
        uses: actions/upload-artifact@v4
        with:
          name: staging-pitr-identity-directory-${{ github.run_id }}
          path: .artifacts/pitr/identity-directory-*.json
          retention-days: 1

  evidence:
    name: Create protected commit-bound evidence
    needs: [user-data, identity-directory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PITR_NAMESPACE: ${{ inputs.namespace }}
      PITR_USER_DATA_TARGET: ${{ inputs.user_data_target }}
      PITR_DIRECTORY_TARGET: ${{ inputs.directory_target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download User Data receipts
        uses: actions/download-artifact@v4
        with:
          name: staging-pitr-user-data-${{ github.run_id }}
          path: .artifacts/pitr

      - name: Download Identity Directory receipts
        uses: actions/download-artifact@v4
        with:
          name: staging-pitr-identity-directory-${{ github.run_id }}
          path: .artifacts/pitr

      - name: Create commit-bound evidence
        run: node scripts/write-pitr-evidence.mjs

      - name: Upload protected PITR evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-pitr-${{ github.sha }}
          path: .artifacts/pitr/staging.json
          retention-days: 7
