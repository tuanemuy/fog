name: Cloudflare delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to recover
        required: true
        type: string
      release_sha:
        description: Full commit SHA referenced by the release tag
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify release candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build Node runtime
        run: pnpm build

  staging:
    name: Deploy staging
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging-fog.${{ vars.DOMAIN }}
    concurrency:
      group: fog-staging
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    env:
      DEPLOYMENT_ENV: staging
      DEPLOYMENT_SHA: ${{ github.sha }}
      DOMAIN: ${{ vars.DOMAIN }}
      DATABASE_IDENTITY: ${{ vars.DATABASE_IDENTITY }}
      DATABASE_IDENTITY_BOOTSTRAP: ${{ vars.DATABASE_IDENTITY_BOOTSTRAP }}
      APP_URL: https://staging-fog.${{ vars.DOMAIN }}
    steps:
      - name: Check out staged SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix candidate output
        id: candidate
        run: echo "sha=${DEPLOYMENT_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Render exact staging config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm cloudflare:config render --stage staging
      - name: Build staging artifact and provenance
        run: pnpm build:cloudflare:stage --stage staging
      - name: Verify Wrangler staging upload
        run: pnpm cloudflare:deploy --stage staging --dry-run
      - name: Verify staging Cloudflare authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cloudflare:authority --stage staging
      - name: Create staging deployment record
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm cloudflare:github create-staging-deployment
      - name: Migrate staging database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          FOG_GOOGLE_CLIENT_ID: ${{ secrets.FOG_GOOGLE_CLIENT_ID }}
          FOG_GOOGLE_CLIENT_SECRET: ${{ secrets.FOG_GOOGLE_CLIENT_SECRET }}
          FOG_AI_CLIENTS: ${{ secrets.FOG_AI_CLIENTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_IDENTITY_REBIND_FROM: ${{ vars.DATABASE_IDENTITY_REBIND_FROM }}
        run: pnpm db:migrate:cloudflare --stage staging --config .cloudflare/generated/staging/wrangler.json
      - name: Synchronize staging runtime secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          FOG_GOOGLE_CLIENT_ID: ${{ secrets.FOG_GOOGLE_CLIENT_ID }}
          FOG_GOOGLE_CLIENT_SECRET: ${{ secrets.FOG_GOOGLE_CLIENT_SECRET }}
          FOG_AI_CLIENTS: ${{ secrets.FOG_AI_CLIENTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cloudflare:secrets --stage staging
      - name: Deploy staging Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          FOG_GOOGLE_CLIENT_ID: ${{ secrets.FOG_GOOGLE_CLIENT_ID }}
          FOG_GOOGLE_CLIENT_SECRET: ${{ secrets.FOG_GOOGLE_CLIENT_SECRET }}
          FOG_AI_CLIENTS: ${{ secrets.FOG_AI_CLIENTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cloudflare:deploy --stage staging --deploy
      - name: Verify staging release and database readiness
        run: pnpm cloudflare:smoke
      - name: Mark staging deployment successful
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_STATE: success
        run: pnpm cloudflare:github set-staging-status
      - name: Mark staging deployment failed
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_STATE: failure
        run: pnpm cloudflare:github set-staging-status

  release:
    name: Release Please
    if: github.event_name == 'push'
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.normalize.outputs.release_created }}
      tag_name: ${{ steps.normalize.outputs.tag_name }}
      sha: ${{ steps.normalize.outputs.sha }}
    steps:
      - name: Check out staged SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.staging.outputs.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Validate Release Please outputs
        id: normalize
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          STAGED_SHA: ${{ needs.staging.outputs.sha }}
        run: pnpm cloudflare:github release-output

  validate-production:
    name: Validate production release publicly
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
      sha: ${{ steps.validate.outputs.sha }}
      release_id: ${{ steps.validate.outputs.release_id }}
      release_updated_at: ${{ steps.validate.outputs.release_updated_at }}
      tag_object_sha: ${{ steps.validate.outputs.tag_object_sha }}
      staging_deployment_id: ${{ steps.validate.outputs.staging_deployment_id }}
      staging_status_id: ${{ steps.validate.outputs.staging_status_id }}
      staging_run_id: ${{ steps.validate.outputs.staging_run_id }}
      staging_run_attempt: ${{ steps.validate.outputs.staging_run_attempt }}
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || needs.release.outputs.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate immutable release and successful staging run
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release.outputs.tag_name }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || needs.release.outputs.sha }}
        run: pnpm cloudflare:github validate-release

  production:
    name: Deploy production
    needs: validate-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://fog.${{ vars.DOMAIN }}
    concurrency:
      group: fog-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: read
    env:
      DEPLOYMENT_ENV: production
      DEPLOYMENT_SHA: ${{ needs.validate-production.outputs.sha }}
      DOMAIN: ${{ vars.DOMAIN }}
      DATABASE_IDENTITY: ${{ vars.DATABASE_IDENTITY }}
      DATABASE_IDENTITY_BOOTSTRAP: ${{ vars.DATABASE_IDENTITY_BOOTSTRAP }}
      APP_URL: https://fog.${{ vars.DOMAIN }}
    steps:
      - name: Check out validated release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-production.outputs.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Revalidate release after approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-production.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.validate-production.outputs.sha }}
          EXPECTED_RELEASE_ID: ${{ needs.validate-production.outputs.release_id }}
          EXPECTED_RELEASE_UPDATED_AT: ${{ needs.validate-production.outputs.release_updated_at }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate-production.outputs.tag_object_sha }}
          EXPECTED_STAGING_DEPLOYMENT_ID: ${{ needs.validate-production.outputs.staging_deployment_id }}
          EXPECTED_STAGING_STATUS_ID: ${{ needs.validate-production.outputs.staging_status_id }}
          EXPECTED_STAGING_RUN_ID: ${{ needs.validate-production.outputs.staging_run_id }}
          EXPECTED_STAGING_RUN_ATTEMPT: ${{ needs.validate-production.outputs.staging_run_attempt }}
        run: pnpm cloudflare:github validate-release
      - name: Render exact production config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm cloudflare:config render --stage production
      - name: Build production artifact and provenance
        run: pnpm build:cloudflare:stage --stage production
      - name: Verify Wrangler production upload
        run: pnpm cloudflare:deploy --stage production --dry-run
      - name: Verify production Cloudflare authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cloudflare:authority --stage production
      - name: Migrate production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          FOG_GOOGLE_CLIENT_ID: ${{ secrets.FOG_GOOGLE_CLIENT_ID }}
          FOG_GOOGLE_CLIENT_SECRET: ${{ secrets.FOG_GOOGLE_CLIENT_SECRET }}
          FOG_AI_CLIENTS: ${{ secrets.FOG_AI_CLIENTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_IDENTITY_REBIND_FROM: ${{ vars.DATABASE_IDENTITY_REBIND_FROM }}
        run: pnpm db:migrate:cloudflare --stage production --config .cloudflare/generated/production/wrangler.json
      - name: Synchronize production runtime secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          FOG_GOOGLE_CLIENT_ID: ${{ secrets.FOG_GOOGLE_CLIENT_ID }}
          FOG_GOOGLE_CLIENT_SECRET: ${{ secrets.FOG_GOOGLE_CLIENT_SECRET }}
          FOG_AI_CLIENTS: ${{ secrets.FOG_AI_CLIENTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cloudflare:secrets --stage production
      - name: Deploy production Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          FOG_GOOGLE_CLIENT_ID: ${{ secrets.FOG_GOOGLE_CLIENT_ID }}
          FOG_GOOGLE_CLIENT_SECRET: ${{ secrets.FOG_GOOGLE_CLIENT_SECRET }}
          FOG_AI_CLIENTS: ${{ secrets.FOG_AI_CLIENTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cloudflare:deploy --stage production --deploy
      - name: Verify production release and database readiness
        run: pnpm cloudflare:smoke
