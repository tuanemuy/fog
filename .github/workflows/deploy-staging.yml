name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a running deploy: stopped between the two Workers, it leaves
# the state Worker ahead of the request Worker (docs/runtime_cloudflare.md 4.4).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      stage: staging
    secrets: inherit
