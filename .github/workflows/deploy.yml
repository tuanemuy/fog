name: Deploy

# The deploy of one stage, called by deploy-staging.yml and
# deploy-production.yml, which differ only in their trigger and stage name.
# The steps are docs/runtime_cloudflare.md 4.1 and 4.2, in that order. The
# secret check comes first so that a bad secret file stops the run before
# Pulumi or either Worker is touched.
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sops
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sops" "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops

      - name: Check the secret files
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: pnpm secrets:check "$STAGE"

      - name: Provision the resources stack
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: ${{ inputs.stage }}
          work-dir: infra/cloudflare/pulumi/resources
          pulumi-version: 3.265.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Render both Workers' configs
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
        run: pnpm "cf:render:$STAGE"

      # Idempotent; the retention is not a wrangler config key, so nothing
      # else sets it (docs/runtime_cloudflare.md 4.1, step 4).
      - name: Set the DLQ retention
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          dlq=$(pulumi -C infra/cloudflare/pulumi/resources -s "$STAGE" stack output dlqQueueName)
          pnpm --filter @repo/web exec wrangler queues update "$dlq" --message-retention-period-secs 600

      # Stage build, then the state Worker, then the request Worker: the
      # request Worker's Durable Object bindings name the state Worker's
      # script, which has to exist first.
      - name: Build and deploy both Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm "deploy:$STAGE:all"

      - name: Upload the secrets and compare what each Worker holds
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm secrets:push "$STAGE"

      # Last: Cloudflare rejects a custom-domain binding for a Worker that
      # has not been uploaded.
      - name: Bind the hostname
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: ${{ inputs.stage }}
          work-dir: infra/cloudflare/pulumi/routes
          pulumi-version: 3.265.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
