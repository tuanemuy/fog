name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-unit:
    name: Lint / Format / Typecheck / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit:evidence

      - name: Upload unit reporter evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-unit
          path: .artifacts/test-results/*.evidence.json

  integration:
    name: Cloudflare integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration:evidence

      - name: Local lifecycle acceptance
        run: |
          pnpm test:lifecycle:cli
          node scripts/record-command-evidence.mjs "pnpm test:lifecycle:cli"

      - name: Operator CLI dependency smoke
        run: |
          pnpm --filter @repo/web operator:cli:smoke
          node scripts/record-command-evidence.mjs "pnpm --filter @repo/web operator:cli:smoke"

      - name: Upload integration reporter evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-integration
          path: .artifacts/test-results/*.evidence.json

  build:
    name: Cloudflare build and configuration audit
    needs: [lint-typecheck-unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm build
          node scripts/record-command-evidence.mjs "pnpm build"

      - name: Staging deploy dry-run
        run: |
          pnpm deploy:staging:dry
          node scripts/record-command-evidence.mjs "pnpm deploy:staging:dry"

      - name: Legacy runtime and production artifact audit
        run: |
          pnpm audit:legacy
          node scripts/record-command-evidence.mjs "pnpm audit:legacy"

      - name: Download test reporter evidence
        uses: actions/download-artifact@v4
        with:
          pattern: test-evidence-*
          path: .artifacts/test-results
          merge-multiple: true

      - name: Executable test traceability audit
        run: pnpm audit:test-traceability
