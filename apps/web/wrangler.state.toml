name = "fog-state"
main = "app/server.state.ts"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

# The state Worker must not receive request-only secrets. With this explicit
# empty declaration Wrangler excludes every key from the shared `.dev.vars`.
[secrets]
required = []

[[durable_objects.bindings]]
name = "USER_DATA"
class_name = "UserDataDurableObject"

[[durable_objects.bindings]]
name = "IDENTITY_DIRECTORY"
class_name = "IdentityDirectoryDurableObject"

[[durable_objects.bindings]]
name = "ACCOUNT_HOME"
class_name = "AccountHomeDurableObject"

[exports.UserDataDurableObject]
type = "durable-object"
storage = "sqlite"

[exports.IdentityDirectoryDurableObject]
type = "durable-object"
storage = "sqlite"

[exports.AccountHomeDurableObject]
type = "durable-object"
storage = "sqlite"
