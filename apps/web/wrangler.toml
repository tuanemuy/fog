# LOCAL DEV ONLY — `pnpm dev` / `pnpm build` auto-discover this file via
# `@cloudflare/vite-plugin`. Do NOT run `wrangler deploy` against it:
# the resource names below lack the stage suffix that keeps environments
# from colliding. Deploy via `wrangler.staging.toml` / `wrangler.production.toml`.
name = "tanstack-start-template"
main = "app/server.cloudflare.ts"
compatibility_date = "2026-05-01"
# `nodejs_compat` is required because @tanstack/react-start imports
# `node:async_hooks` / `node:stream` / `node:crypto` / `node:util`.
compatibility_flags = ["nodejs_compat"]

# Static assets produced by `vite build` (`dist/client`).
[assets]
directory = "./dist/client"
binding = "ASSETS"

[vars]
APP_URL = "http://localhost:8787"

# D1: read/write for the request path.
# See packages/core/src/adapters/d1/.
[[d1_databases]]
binding = "DB"
database_name = "tanstack-start-template-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/core/src/adapters/d1/migrations"
