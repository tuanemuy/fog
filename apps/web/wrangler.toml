# LOCAL DEV ONLY — `pnpm dev` / `pnpm build` auto-discover this file via
# `@cloudflare/vite-plugin`. Do NOT run `wrangler deploy` against it:
# the resource names below lack the stage suffix that keeps environments
# from colliding. Deploy via `wrangler.staging.toml` / `wrangler.production.toml`.
#
# This is the **request Worker**: it serves HTTP, does the CPU-bound work,
# and hosts the queue consumers and the DLQ handler in its `queue()`
# handler. The Durable Object classes live in the **state Worker**, whose
# config is a separate file (`wrangler.state.toml`) rather than an
# `[env.*]` block here — deploying and `wrangler dev` both want a real
# file, `CLOUDFLARE_ENV` selects one environment across every Worker at
# once so a single `[env.state]` cannot be pointed at the auxiliary
# Worker alone, and aiming the Vite plugin at this same file twice makes
# both Workers derive the same Vite environment name and collide.
#
# `script_name` below must equal the `name` in `wrangler.state.toml`. The
# Vite plugin resolves cross-Worker Durable Object bindings by that name
# and **silently does nothing when it does not match** — nothing fails at
# config load, and the mismatch only shows when a DO stub is actually
# called. A unit test pins the two names against each other, and the
# `/__diagnostics/schema-version` route makes one real round trip.
name = "tanstack-start-template"
main = "app/server.cloudflare.ts"
compatibility_date = "2026-05-01"
# `nodejs_compat` is required because @tanstack/react-start imports
# `node:async_hooks` / `node:stream` / `node:crypto` / `node:util`.
compatibility_flags = ["nodejs_compat"]

# Static assets produced by `vite build` (`dist/client`).
[assets]
directory = "./dist/client"
binding = "ASSETS"

[vars]
APP_URL = "http://localhost:3000"
# The sender the mail provider is asked to use. Not a secret: it is what the
# recipient sees. Locally the console sink (`MAIL_DEV_SINK` in `.dev.vars`)
# never reads it.
MAIL_FROM_ADDRESS = "fog <onboarding@resend.dev>"
# Registers the diagnostic route that makes one round trip into a Durable
# Object through the stub-selection adapter. Declared here and in no
# deployed stage's config, so the route does not exist in staging or
# production.
DIAGNOSTICS_ENABLED = "true"


# Durable Object namespaces, implemented by the state Worker.
[[durable_objects.bindings]]
name = "USER_DATA"
class_name = "UserDataDurableObject"
script_name = "tanstack-start-template-state"

[[durable_objects.bindings]]
name = "IDENTITY_DIRECTORY"
class_name = "IdentityDirectoryDurableObject"
script_name = "tanstack-start-template-state"

# The mail consumer. `max_retries` and `dead_letter_queue` are the two
# values that make "burn through the retries, then the DLQ" real; both are
# mirrored as declared values in `application/delivery/tuning.ts`, and the
# constraint `queue max retry period + DLQ retention < reset token TTL`
# is checked there. `message_retention_period` is not a key here at all —
# it belongs to the Queue resource and is set out of band.
[[queues.consumers]]
queue = "tanstack-start-template-events"
max_batch_size = 25
max_batch_timeout = 30 # seconds
max_retries = 3
dead_letter_queue = "tanstack-start-template-events-dlq"

# The DLQ handler. It has no dead-letter target of its own — a re-failure
# here would loop — so `max_retries` is kept low.
[[queues.consumers]]
queue = "tanstack-start-template-events-dlq"
max_batch_size = 25
max_batch_timeout = 30 # seconds
max_retries = 1
