name: fog-cf-resources
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
description: |
  Cloudflare persistent resources (Zone, DNS) for the fog runtime. Deploy
  this stack BEFORE running `wrangler deploy` — its outputs feed
  `pnpm cf:render:<stage>`. Durable Object namespaces are not here: the
  state Worker's `exports` declaration creates them at deploy time.
main: index.ts
config:
  pulumi:tags:
    value:
      pulumi:template: typescript
